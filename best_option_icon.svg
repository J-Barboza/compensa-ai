<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente principal -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente para produtos -->
    <linearGradient id="productGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="productGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFCC80;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sombra -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circular -->
  <circle cx="96" cy="96" r="88" fill="url(#mainGradient)" filter="url(#shadow)"/>
  
  <!-- Produto 1 (menor) -->
  <rect x="45" y="70" width="28" height="40" rx="4" fill="url(#productGradient1)" stroke="#1976D2" stroke-width="2"/>
  <rect x="47" y="72" width="24" height="6" fill="#1976D2" opacity="0.3"/>
  <rect x="47" y="80" width="18" height="3" fill="#1976D2" opacity="0.5"/>
  <rect x="47" y="85" width="20" height="3" fill="#1976D2" opacity="0.5"/>
  
  <!-- Produto 2 (maior - melhor opção) -->
  <rect x="75" y="55" width="35" height="55" rx="5" fill="url(#productGradient2)" stroke="#F57C00" stroke-width="2"/>
  <rect x="78" y="58" width="29" height="8" fill="#F57C00" opacity="0.3"/>
  <rect x="78" y="68" width="22" height="4" fill="#F57C00" opacity="0.5"/>
  <rect x="78" y="74" width="25" height="4" fill="#F57C00" opacity="0.5"/>
  <rect x="78" y="80" width="20" height="4" fill="#F57C00" opacity="0.5"/>
  
  <!-- Produto 3 (médio) -->
  <rect x="115" y="65" width="32" height="45" rx="4" fill="url(#productGradient1)" stroke="#1976D2" stroke-width="2"/>
  <rect x="117" y="67" width="28" height="7" fill="#1976D2" opacity="0.3"/>
  <rect x="117" y="76" width="20" height="3" fill="#1976D2" opacity="0.5"/>
  <rect x="117" y="81" width="23" height="3" fill="#1976D2" opacity="0.5"/>
  
  <!-- Ícone de "melhor" (estrela) no produto central -->
  <polygon points="92,45 94,51 101,51 95.5,55 97.5,61 92,57 86.5,61 88.5,55 83,51 90,51" 
           fill="#FFD700" stroke="#FF8F00" stroke-width="1"/>
  
  <!-- Símbolo de comparação (balanças estilizadas) -->
  <line x1="40" y1="125" x2="152" y2="125" stroke="white" stroke-width="3" opacity="0.8"/>
  <circle cx="96" cy="125" r="6" fill="white"/>
  
  <!-- Setas indicativas -->
  <polygon points="60,140 65,135 65,138 75,138 75,142 65,142 65,145" fill="white" opacity="0.8"/>
  <polygon points="132,140 127,135 127,138 117,138 117,142 127,142 127,145" fill="white" opacity="0.8"/>
  
  <!-- Texto "BO" estilizado (Best Option) -->
  <text x="96" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">BO</text>
</svg>